algorithm: Mig-PPO

environment:
  # Match the eager Qwen2-0.5B collection: four Llumnix instances (one RTX 3060
  # per instance), 128 sequences per instance, 22084 measured GPU KV blocks per
  # instance, 16-token blocks, 2112 max length, and nine mixed request profiles.
  num_instances: 4
  # Llumnix polls instance state every 50 ms and runs pair migration every poll.
  # 4000 steps preserve the 200-second formal measurement horizon per episode.
  decision_interval_sec: 0.05
  max_decisions: 4000
  # The sampled vLLM cap is per instance; this legacy alias is unused when
  # max_num_seqs_per_instance is set.
  max_running_requests: null
  max_num_seqs_per_instance: 128
  total_kv_blocks: 22084
  block_size_tokens: 16
  max_model_len: 2112
  # vLLM's sampled max_num_batched_tokens was omitted and resolves to
  # max(max_model_len, 2048) = 2112 with chunked prefill disabled.
  max_num_batched_tokens: 2112
  ttft_slo_ms: 2000.0
  tpot_slo_ms: 150.0
  request_timeout_sec: null
  migration_cooldown_sec: 0.0
  max_state_age_sec: 2.0
  safety_margin_blocks: 16
  safety_margin_fraction: 0.05
  arrival_model: poisson
  workload_scenario: mix
  target_qps_levels: [9, 12, 15, 18, 21]
  prompt_profiles: [256, 512, 1048]
  output_profiles: [256, 512, 1048]
  # These values are placeholders until fitted from the target GPU run logs.
  prefill_ms_per_token: 0.025
  prefill_intercept_ms: 4.0
  decode_ms_per_request: 2.5
  decode_ms_per_context_token: 0.004
  decode_intercept_ms: 1.0
  migration_alpha_ms: 50.0
  migration_beta_ms_per_block: 0.1
  calibration_status: uncalibrated

ppo:
  device: cuda:0
  hidden_size: 64
  learning_rate: 0.0003
  rollout_steps: 512
  update_epochs: 10
  minibatch_size: 64
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  max_grad_norm: 0.5

reward:
  weights:
    throughput: 0.20
    waiting_pressure: 0.25
    tpot_pressure: 0.20
    slo_violations: 0.25
    kv_pressure: 0.10
    migration_cost: 0.10
    migration_count: 0.05
    migration_failure: 0.20
  scales:
    throughput_tokens_per_sec: 100.0
    mean_waiting_requests: 4.0
    tpot_ms: 150.0
    slo_violation_rate: 0.10
    kv_usage: 0.90
    migration_cost_ms: 1000.0
    migration_operations: 1.0
    migration_failures: 1.0

training:
  seed: 42
  total_episodes: 2000
  normalization_steps: 256
  evaluation_interval_updates: 10
  torch_num_threads: 1
  output_dir: rl_scheduler/runs/mig_ppo

