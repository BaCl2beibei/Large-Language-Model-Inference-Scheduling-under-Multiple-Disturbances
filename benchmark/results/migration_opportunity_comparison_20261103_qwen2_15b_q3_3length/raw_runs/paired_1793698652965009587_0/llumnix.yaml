INSTANCE:
  ENABLE_DEFRAG: false
  MAX_MIGRATION_CONCURRENCY: 1
  MIGRATION_BACKEND: rayrpc
  MIGRATION_LOAD_METRIC: remaining_steps
  REQUEST_MIGRATION_POLICY: SR
MANAGER:
  DISPATCH_LOAD_METRIC: remaining_steps
  DISPATCH_POLICY: load
  ENABLE_PRE_STOP_MIGRATION: false
  ENABLE_ROUTINE_MIGRATION: false
  ENABLE_SCALING: false
  INITIAL_INSTANCES: 4
  MIGRATE_OUT_THRESHOLD: 9000.0
  PAIR_MIGRATION_FREQUENCY: 1
  PAIR_MIGRATION_POLICY: balanced
  POLLING_INTERVAL: 0.05
SERVER:
  HOST: 127.0.0.1
  LAUNCH_RAY_CLUSTER: false
  PORT: 18080
  RAY_CLUSTER_PORT: 20000
  REQUEST_OUTPUT_QUEUE_TYPE: rayqueue
