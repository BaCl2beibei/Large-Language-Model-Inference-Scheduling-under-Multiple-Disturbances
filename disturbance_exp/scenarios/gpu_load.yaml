experiment:
  name: gpu_load_single_gpu
  seed: 42
  duration_sec: 12
service:
  base_url: http://127.0.0.1:8080
limits:
  max_inflight: 1
  max_requests: 3
  request_timeout_sec: 60
workload:
  arrival: fixed
  base_qps: 0.2
  input_tokens: 32
  output_tokens: 4
  max_model_len: 8192
  tokenizer: /workspace/llumnix-ray/model
monitoring:
  interval_sec: 1
slo:
  ttft_ms: 2000
  tpot_ms: 150
events:
  - at_sec: 1
    type: gpu_compute
    action: start
    target: gpu_0
    duty_cycle: 0.1
    memory_limit_mib: 32
    duration_sec: 3
